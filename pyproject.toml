[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "drama-mcp-service"
version = "0.1.0"
description = "Thin MCP host adapter for the Drama Plugin tool registry."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "drama-plugin>=0.1,<1",
  "mcp>=2,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<2",
  "mypy>=1.10,<2",
]

[project.scripts]
drama-mcp-service = "drama_mcp_service.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_mcp_service"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.mypy]
python_version = "3.12"
packages = ["drama_mcp_service"]
strict = true
incremental = false
cache_dir = "/tmp/drama-mcp-service-mypy"

[tool.hatch.envs.default]
path = ".venv"

